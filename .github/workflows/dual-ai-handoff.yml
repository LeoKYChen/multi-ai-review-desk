name: Dual AI learning handoff
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'verification/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/dual-ai-handoff.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'verification/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.github/workflows/dual-ai-handoff.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: node verification/dual-ai-handoff.cjs
