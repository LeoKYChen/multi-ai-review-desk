name: Deploy Cloudflare staging (opt-in)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type deploy-private-staging after Cloudflare Access plan is ready"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: multi-ai-review-desk-staging
  cancel-in-progress: false
jobs:
  deploy:
    # Both explicit manual confirmation and a repository variable are required.
    if: ${{ inputs.confirm == 'deploy-private-staging' && vars.ENABLE_STAGING_DEPLOY == 'true' && vars.ACCESS_POLICY_VERIFIED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ vars.CF_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate required configuration (without printing secrets)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$OWNER_TOKEN" || { echo "::error::Missing secret OWNER_TOKEN"; exit 1; }
          test -n "$OWNER_PASSWORD" || { echo "::error::Missing secret OWNER_PASSWORD"; exit 1; }
          test ${#OWNER_TOKEN} -ge 32 || { echo "::error::OWNER_TOKEN must be at least 32 characters"; exit 1; }
          test ${#OWNER_PASSWORD} -ge 16 || { echo "::error::OWNER_PASSWORD must be at least 16 characters"; exit 1; }
      - name: Install Wrangler
        working-directory: cloudflare
        run: npm install --no-fund --no-audit
      - name: Check unit tests and SQLite migrations
        run: |
          cd cloudflare
          npm test
          python3 test/check_schema.py
      - name: Generate staging Wrangler config
        working-directory: cloudflare
        run: node scripts/prepare-staging.mjs
      - name: Assert no public workers.dev address or paid AI calls
        shell: bash
        run: |
          grep -qx 'workers_dev = false' cloudflare/wrangler.toml
          grep -qx 'MODEL_API_ENABLED = "false"' cloudflare/wrangler.toml
          grep -qx 'BACKGROUND_JOBS_ENABLED = "false"' cloudflare/wrangler.toml
      - name: Preview unapplied D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations list DB --remote
      - name: Apply remote D1 migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy staging Worker and static assets
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Configure private owner secrets
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OWNER_TOKEN: ${{ secrets.OWNER_TOKEN }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_TOKEN" | npx wrangler secret put OWNER_TOKEN
          printf '%s' "$OWNER_PASSWORD" | npx wrangler secret put OWNER_PASSWORD
      - name: Deployment notes
        shell: bash
        run: |
          echo "Staging deployment submitted. Check Cloudflare for the workers.dev URL."
          echo "MODEL_API_ENABLED remains false. No OpenAI/Gemini API calls will be made."
          echo "Before uploading non-public Word material, verify Access restriction, login and D1 backup."
