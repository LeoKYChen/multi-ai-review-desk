name: Deploy standalone AI review desk to GitHub Pages

# Automatically publish changes to the site; keep manual dispatch as a fallback.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-review-pages
  cancel-in-progress: false

jobs:
  # Never publish a page that fails the browser acceptance checks.
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node verification/dual-ai-handoff.cjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node verification/ios-handoff-layout.cjs
      - run: node verification/manual-review-default.cjs
      - run: node verification/multi-tab-sync.cjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check application script syntax
        run: |
          node --input-type=commonjs <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('docs/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Application script is missing');
          for (const [, source] of scripts) new vm.Script(source);
          console.log('Application syntax checked');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish Pages
        id: deployment
        uses: actions/deploy-pages@v4
