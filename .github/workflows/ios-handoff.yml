name: iOS dual AI handoff and mobile layout
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'verification/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-handoff.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'verification/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: node verification/ios-handoff-layout.cjs
      - run: node verification/manual-review-default.cjs
      - run: node verification/multi-tab-sync.cjs
