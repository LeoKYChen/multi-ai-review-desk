name: Cloudflare credential presence preflight (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 3
    steps:
      - name: Check required secret presence and length without disclosure
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SIGNING_SECRET: ${{ secrets.OWNER_TOKEN }}
          LOGIN_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          failed=0
          if [[ -n "$DEPLOY_TOKEN" ]]; then echo "PASS: Cloudflare deployment secret exists"; else echo "FAIL: Cloudflare deployment secret missing"; failed=1; fi
          if (( ${#SIGNING_SECRET} >= 32 )); then echo "PASS: OWNER_TOKEN length"; elif [[ -z "$SIGNING_SECRET" ]]; then echo "FAIL: OWNER_TOKEN missing (repository/environment secret)"; failed=1; else echo "FAIL: OWNER_TOKEN shorter than 32 characters"; failed=1; fi
          if (( ${#LOGIN_PASSWORD} >= 16 )); then echo "PASS: OWNER_PASSWORD length"; elif [[ -z "$LOGIN_PASSWORD" ]]; then echo "FAIL: OWNER_PASSWORD missing (repository/environment secret)"; failed=1; else echo "FAIL: OWNER_PASSWORD shorter than 16 characters"; failed=1; fi
          echo "This verifies presence and minimum length only, not Cloudflare API token validity or Access protection."
          exit "$failed"
