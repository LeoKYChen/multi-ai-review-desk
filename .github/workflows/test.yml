name: Validate D1-only backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word parser and Worker API unit tests
        run: cd cloudflare && npm test
      - name: Browser JavaScript syntax
        run: node --check cloudflare/public/app.js
      - name: D1 schema and source immutability
        run: python3 cloudflare/test/check_schema.py
      - name: Cloudflare Workers bundle dry-run (no deployment)
        run: |
          cd cloudflare
          npm install --no-fund --no-audit
          cp wrangler.toml.example wrangler.toml
          sed -i 's/REPLACE_WITH_YOUR_D1_DATABASE_ID/00000000-0000-4000-8000-000000000000/' wrangler.toml
          npx wrangler deploy --dry-run --outdir=.wrangler-build
