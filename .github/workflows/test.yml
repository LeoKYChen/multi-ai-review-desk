name: Validate D1-only backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word parser and Worker API unit tests
        run: cd cloudflare && npm test
      - name: Offline v0.8 self-contained HTML regression checks
        run: node --test offline/test/*.test.mjs
      - name: Offline v0.8 to D1 conversion unit tests
        run: node --test tools/test/*.test.mjs
      - name: Offline backup migration SQLite dry-run (no Cloudflare access)
        run: python3 tools/test/sqlite-dry-run.py
      - name: Browser JavaScript syntax
        run: node --check cloudflare/public/app.js
      - name: D1 schema and source immutability
        run: python3 cloudflare/test/check_schema.py
