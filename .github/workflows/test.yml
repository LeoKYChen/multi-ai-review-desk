name: Validate D1-only backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Word parser and Worker API unit tests
        run: cd cloudflare && npm test
      - name: D1 schema and source immutability
        run: python3 cloudflare/test/check_schema.py
